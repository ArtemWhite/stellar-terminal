services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: user
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user"]
      interval: 5s
      timeout: 3s
      retries: 10

  user-service:
    build:
      context: .
      args:
        GITHUB_ACTOR: ${GITHUB_ACTOR:-}
        GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/user
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SERVER_PORT: "8083"
      CATALOG_BASE_URL: http://catalog-service:8080
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
