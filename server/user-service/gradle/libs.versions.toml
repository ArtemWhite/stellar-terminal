[versions]
kotlin = "2.4.0"
spring-boot = "4.1.1"
testcontainers = "2.0.5"

[libraries]
shared = { module = "com.artemwhite:shared", version = "1.0.0" }
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-test = { module = "org.springframework.boot:spring-boot-starter-test" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
# Spring Boot 4 split Liquibase auto-config into its own starter (was bundled in autoconfigure before).
spring-boot-liquibase = { module = "org.springframework.boot:spring-boot-starter-liquibase" }
spring-security-crypto = { module = "org.springframework.security:spring-security-crypto" }
postgresql = { module = "org.postgresql:postgresql" }
# Spring Boot 4.1.x ships JUnit 6; Gradle's bundled launcher is too old, so pin a matching one.
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
# Testcontainers 2.x renamed its modules (testcontainers-postgresql / testcontainers-jdbc).
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
testcontainers-jdbc = { module = "org.testcontainers:testcontainers-jdbc", version.ref = "testcontainers" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
