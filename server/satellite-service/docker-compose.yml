services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: satellite
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d satellite"]
      interval: 5s
      timeout: 3s
      retries: 10

  satellite-service:
    build:
      context: .
      args:
        GITHUB_ACTOR: ${GITHUB_ACTOR:-}
        GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/satellite
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SERVER_PORT: "8082"
      CATALOG_BASE_URL: http://catalog-service:8080
      EVENT_URL: http://user-service:8083/api/v1/events
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
